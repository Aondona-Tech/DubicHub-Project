<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="description" content="Read what guests are saying about their Dubic Hub dining experience.">
	<title>Dubic Hub | Guest Reviews</title>
	<link rel="stylesheet" href="reviews.css">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
</head>
<body>
	
	<main>
		<section class="share-section" id="share-review" aria-labelledby="share-title">
            
			<div class="share-intro">
                <p class="eyebrow">Your turn</p>
                <h2 id="share-title">Tell us how<br><em>we did.</em></h2>
                <p>Your note might be the nudge someone needs to discover their new favourite table.</p></div>

			<form id="review-form">
				<label for="name">Your name</label><input id="name" name="name" type="text" placeholder="e.g. Ada O." required>
				<label for="rating">Your rating</label><select id="rating" name="rating" required><option value="">Choose a rating</option><option value="5">5 stars - Exceptional</option><option value="4">4 stars - Great</option><option value="3">3 stars - Good</option><option value="2">2 stars - Could be better</option><option value="1">1 star - Needs work</option></select>
				<label for="comment">Your review</label><textarea id="comment" name="comment" rows="4" placeholder="What did you enjoy?" required></textarea>
				<button type="submit">Publish review <span aria-hidden="true">&#8599;</span></button><p class="form-message" role="status" aria-live="polite"></p>
			</form>

		</section>
	</main>

	<script>
		document.querySelector('#review-form').addEventListener('submit', function (event) {
			event.preventDefault();
			const message = this.querySelector('.form-message');
			message.textContent = 'Thank you - your review has been received.';
			this.reset();
		});
	</script>
</body>
</html>
